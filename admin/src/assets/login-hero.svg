<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01b7bb"/>
      <stop offset="0.5" stop-color="#6a5bd4"/>
      <stop offset="1" stop-color="#9600fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fecc2b" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#fecc2b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fecc2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#01e0e4" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#9600fc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4a008a" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- blobs suaves -->
  <circle cx="160" cy="180" r="220" fill="#01b7bb" opacity="0.35" filter="url(#soft)"/>
  <circle cx="680" cy="760" r="260" fill="#9600fc" opacity="0.4" filter="url(#soft)"/>
  <circle cx="620" cy="140" r="150" fill="#fecc2b" opacity="0.25" filter="url(#soft)"/>

  <!-- orbe central tipo "esfera de cristal" -->
  <g filter="url(#soft)">
    <ellipse cx="400" cy="470" rx="170" ry="150" fill="url(#orb)"/>
  </g>
  <ellipse cx="400" cy="460" rx="150" ry="132" fill="url(#orb)"/>
  <ellipse cx="360" cy="410" rx="55" ry="40" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="420" cy="560" rx="90" ry="26" fill="#01e0e4" opacity="0.35" filter="url(#soft)"/>
</svg>
